<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="style.css" rel="stylesheet">
  <style>

  </style>
</head>
<body>
  <h1 id="heading">calculator</h1>
  <h2 id="resultscreen"></h2>
  <div class="numberblock">
    <div style="display:flex">
      <button id="cancelbtn">⌫</button>
      <button id="clearbtn">C</button>
      <button id="openbracket" value='(' > (</button>
       <button id="closebracket" value=')'> )</button>
    </div>
    <div >
      <button id="sevenbtn" value='7' >7</button>
      <button id="eightbtn" value='8' >8</button>
      <button id="ninebtn" value='9' >9</button>
       <button id="multiplybtn"value='*' >x</button>
    </div>
    <div >
      <button id="fourbtn" value='4' >4</button>
      <button id="fivebtn"value='5' >5</button>
      <button id="sixbtn"value='6' >6</button>
      <button id="dividebtn"value='/' >÷</button>
    </div>
    <div>
      <button id="onebtn" value='1' >1</button>
      <button id="twobtn"value='2' >2</button>
      <button id="threebtn" value='3' >3</button>
      <button id="minusbtn"value='-' >-</button>
    </div>
    <div >
      <button id="zerobtn" value='0'>0</button>
      <button id="pointbtn" value='.' >.</button>
      <button id="equalbtn" value='=' >=</button>
      <button id="plusbtn" value='+' >+</button>
    </div>
  </div>
  <script src='main.js'></script>
 
</body>
</html>
